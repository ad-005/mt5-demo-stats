# =============================================================================
# FlatLaf Light Theme Properties
# =============================================================================
# Light theme-specific overrides. Base settings are in FlatLaf.properties.
# =============================================================================

# ===== TABLE HEADER =====
# Light theme uses a lighter separator color
TableHeader.separatorColor = #d2d8e0

# ===== MACOS-LIKE LIGHT TUNING =====
Component.focusWidth = 1
Component.innerFocusWidth = 0
Component.focusedBorderColor = #8ec5ff

TextComponent.background = #ffffff
TextComponent.foreground = #1f2937
TextComponent.borderColor = #d2d8e0

ComboBox.background = #ffffff
ComboBox.buttonBackground = #ffffff
ComboBox.buttonArrowColor = #6b7280

ScrollBar.thumb = #cfd7e3
ScrollBar.track = #f1f3f6
