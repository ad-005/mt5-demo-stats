# =============================================================================
# FlatLaf Global Properties - Shared between Light and Dark themes
# =============================================================================
# This file defines component-level defaults applied via FlatLaf's theming system.
# Application-specific semantic styles are in Theme.java.
# =============================================================================

# ===== GLOBAL FONT =====
# Sets the default font for all components (can be overridden per-component)
defaultFont = IBM Plex Mono

# ===== TOGGLE BUTTONS =====
[style]ToggleButton.selectionButton = \
  arc: 30; \
  borderWidth: 0; \
  background: null; \
  selectedBackground: #ffeaa6; \
  hoverBackground: #fbeec3; \
  pressedBackground: #9c8c59

# ===== TABLE STYLING =====
Table.showHorizontalLines = true
Table.showVerticalLines = true
Table.intercellSpacing = 1, 1

# Table header
TableHeader.font = IBM Plex Mono bold 12
TableHeader.separatorColor = #8c8c8c
# TableHeader.bottomSeparatorColor = #8c8c8c

# ===== PROGRESS BAR =====
# Default styling for progress bars (winrate/bias indicators)
ProgressBar.arc = 0

# ===== LABELS =====
Label.font = IBM Plex Mono 12

# ===== BUTTONS =====
Button.font = IBM Plex Mono bold 16

# ===== TITLED BORDER =====
TitledBorder.font = IBM Plex Mono bold 16
