# =============================================================================
# FlatLaf Global Properties - Shared between Light and Dark themes
# =============================================================================
# This file defines component-level defaults applied via FlatLaf's theming system.
# Application-specific semantic styles are in Theme.java.
# =============================================================================

# ===== GLOBAL FONT =====
# Sets the default font for all components (can be overridden per-component)
defaultFont = IBM Plex Mono
Component.arc = 12
Button.arc = 12
TextComponent.arc = 10
ScrollBar.thumbArc = 999
ScrollBar.width = 12

# ===== LIGHT APP FOUNDATION =====
@bg = #f5f6f8
@surface = #ffffff
@surfaceAlt = #f0f2f5
@text = #1f2937
@textSubtle = #6b7280
@accent = #0a84ff
@border = #d2d8e0

Panel.background = @bg
ScrollPane.background = @surface
Viewport.background = @surface
Label.foreground = @text
Component.focusColor = @accent
Component.borderColor = @border
Component.disabledBorderColor = #e5e7eb

# ===== TOGGLE BUTTONS =====
[style]ToggleButton.selectionButton = \
  arc: 14; \
  borderWidth: 1; \
  borderColor: @border; \
  background: @surface; \
  selectedBackground: #e8f2ff; \
  selectedForeground: @text; \
  hoverBackground: #f2f8ff; \
  pressedBackground: #dbeafe

# ===== TABLE STYLING =====
Table.showHorizontalLines = true
Table.showVerticalLines = false
Table.intercellSpacing = 1, 1
Table.rowHeight = 28
Table.selectionBackground = #e8f2ff
Table.selectionForeground = @text
Table.background = @surface
Table.foreground = @text
Table.gridColor = #e5e7eb

# Table header
TableHeader.font = IBM Plex Mono bold 12
TableHeader.separatorColor = @border
TableHeader.background = @surfaceAlt
TableHeader.foreground = @text
# TableHeader.bottomSeparatorColor = #8c8c8c

# ===== PROGRESS BAR =====
# Default styling for progress bars (winrate/bias indicators)
ProgressBar.arc = 999
ProgressBar.background = #ffe3df

# ===== LABELS =====
Label.font = IBM Plex Mono 12
Label.disabledForeground = @textSubtle

# ===== BUTTONS =====
Button.font = IBM Plex Mono bold 16
Button.background = @surface
Button.foreground = @text
Button.borderColor = @border
Button.hoverBackground = #f3f4f6
Button.pressedBackground = #e5e7eb

# ===== TITLED BORDER =====
TitledBorder.font = IBM Plex Mono bold 16
TitledBorder.titleColor = @text
